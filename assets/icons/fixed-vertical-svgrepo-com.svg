<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800px" height="800px" viewBox="0 0 64 64">
  <!-- top boundary wall -->
  <line x1="10" y1="4" x2="54" y2="4" stroke="#000000" stroke-width="2.5"/>
  <!-- bottom boundary wall -->
  <line x1="10" y1="60" x2="54" y2="60" stroke="#000000" stroke-width="2.5"/>
  <!-- centered fixed-height box -->
  <rect x="20" y="20" width="24" height="24" stroke="#000000" stroke-width="2" fill="none"/>
  <!-- dashed lines showing empty space top and bottom -->
  <line x1="32" y1="4" x2="32" y2="20" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="32" y1="44" x2="32" y2="60" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
