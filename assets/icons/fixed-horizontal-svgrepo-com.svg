<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800px" height="800px" viewBox="0 0 64 64">
  <!-- left boundary wall -->
  <line x1="4" y1="10" x2="4" y2="54" stroke="#000000" stroke-width="2.5"/>
  <!-- right boundary wall -->
  <line x1="60" y1="10" x2="60" y2="54" stroke="#000000" stroke-width="2.5"/>
  <!-- centered fixed-width box -->
  <rect x="20" y="20" width="24" height="24" stroke="#000000" stroke-width="2" fill="none"/>
  <!-- dashed lines showing empty space left and right -->
  <line x1="4" y1="32" x2="20" y2="32" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="44" y1="32" x2="60" y2="32" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
